<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>data recorder</title>
  <link rel="stylesheet" href="style.css?v=64">
  <script>
    if (localStorage.getItem("data-recording-theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <div class="shell">
    <header class="mast">
      <div class="mast-top">
        <div class="mast-id">
          <p class="mark">data recorder</p>
          <p id="summary">Looking for running recorders…</p>
        </div>
        <div class="mast-tools">
          <label class="api-pill">
            API
            <input id="api" type="url" value="http://127.0.0.1:8080" spellcheck="false">
          </label>
          <button type="button" id="theme" class="theme-toggle" aria-label="Theme">
            <span class="theme-knob">
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 3.1v2.2M12 18.7v2.2M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M3.1 12h2.2M18.7 12h2.2M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"/>
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M21.8 15.1A9.7 9.7 0 0 1 18 15.8c-5.4 0-9.8-4.4-9.8-9.8 0-1.3.3-2.6.8-3.8A9.8 9.8 0 0 0 3 11.3 9.8 9.8 0 0 0 12.8 21a9.8 9.8 0 0 0 9-5.9z"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>
    <main id="recorders"></main>
  </div>
  <script src="app.js?v=40"></script>
</body>
</html>
