<!DOCTYPE html>
<html lang="en">
<head>

  <title>Recording Overview</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div class="shell">
    <header class="mast">
      <div class="mast-top">
        <p class="mark">data recorder</p>
        <label class="api-pill">
          <span class="dot" aria-hidden="true"></span>

          <input id="api" type="url" value="http://127.0.0.1:8080" spellcheck="false">

      </div>

          <h1>Recording Overview</h1>

        <p id="summary">Looking for running recorders…</p>
      </div>
    </header>
    <main id="recorders"></main>
  </div>
